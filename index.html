<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>سامانه محاسبه طلا و سکه</title>
    <meta name="theme-color" content="#b8860b" />
    
    <!-- فونت با لینک مستقیم و مطمئن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    
    <!-- کتابخانه‌های کمکی با CDN مطمئن -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* تنظیمات پایه */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazirmatn', 'Tahoma', 'Arial', sans-serif;
            background: #f5f1e8;
            min-height: 100vh;
            padding: 20px 15px;
            direction: rtl;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid #e8e0d4;
        }
        
        /* هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header h1 {
            font-size: 22px;
            font-weight: 900;
            color: #b8860b;
        }
        
        .header button {
            background: #ede8df;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            color: #333;
        }
        
        .header button:active {
            transform: scale(0.95);
        }
        
        /* بخش آپلود */
        .upload-box {
            background: #faf8f5;
            border: 2px dashed #d4af37;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            text-align: center;
        }
        
        .upload-box label {
            display: inline-block;
            background: #b8860b;
            color: white;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .upload-box input[type="file"] {
            display: none;
        }
        
        .upload-box .info {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        
        .upload-box .link {
            color: #b8860b;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
        }
        
        /* بخش کد */
        .code-box {
            background: #faf8f5;
            border: 1.5px solid #d4af37;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .code-box input {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            border: 1.5px solid #d4af37;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            letter-spacing: 2px;
        }
        
        .code-box button {
            padding: 10px 16px;
            background: #b8860b;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        
        .code-box button:active {
            transform: scale(0.95);
        }
        
        .code-box .btn-gray {
            background: #6a6a7a;
        }
        
        /* فرم */
        .form-group {
            margin-bottom: 14px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #4a4a5a;
            margin-bottom: 4px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: #f9f8f6;
            border: 1.5px solid #e8e4dc;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #b8860b;
        }
        
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .row .form-group {
            flex: 1;
            min-width: 100px;
        }
        
        /* چک‌باکس */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: #f9f8f6;
            border-radius: 12px;
            border: 1.5px solid #e8e4dc;
            margin-bottom: 14px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #b8860b;
        }
        
        /* دکمه محاسبه */
        .calc-btn {
            width: 100%;
            padding: 14px;
            background: #b8860b;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            margin: 10px 0 14px;
        }
        
        .calc-btn:active {
            transform: scale(0.97);
        }
        
        /* تب‌ها */
        .tabs {
            display: flex;
            background: #f0ede8;
            border-radius: 14px;
            padding: 4px;
            margin: 16px 0;
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            color: #6a6a7a;
        }
        
        .tab-btn.active {
            background: white;
            color: #b8860b;
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
        }
        
        /* نتایج */
        .results {
            background: #faf9f7;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid #e8e4dc;
            display: none;
            margin-top: 10px;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 14px;
        }
        
        .result-item.total {
            font-size: 17px;
            font-weight: 900;
            color: #b8860b;
            border-top: 2px solid #b8860b;
            padding: 10px;
            margin-top: 8px;
            background: rgba(184,134,11,0.05);
            border-radius: 8px;
        }
        
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .action-row button {
            flex: 1;
            padding: 10px;
            background: #b8860b;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .action-row button:active {
            transform: scale(0.95);
        }
        
        /* مودال‌ها */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal-box {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 20px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        
        .modal-header h3 {
            color: #b8860b;
            font-size: 18px;
        }
        
        .modal-close {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: #999;
        }
        
        .modal-list {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 14px;
        }
        
        .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f8f6;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid #e8e4dc;
        }
        
        .code-item .name {
            font-weight: 700;
            color: #b8860b;
        }
        
        .code-item .details {
            font-size: 12px;
            color: #666;
        }
        
        .code-item .del {
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
        }
        
        .add-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .add-form input {
            padding: 8px 12px;
            border: 1.5px solid #e8e4dc;
            border-radius: 10px;
            flex: 1;
        }
        
        .add-form button {
            padding: 10px;
            background: #b8860b;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        
        /* فاکتور */
        .invoice-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        .invoice-overlay.show {
            display: flex;
        }
        
        .invoice-box {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            border: 2px solid #d4af37;
            overflow: hidden;
        }
        
        .invoice-header {
            background: #f5f1e8;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
        }
        
        .invoice-header h3 {
            color: #b8860b;
            font-size: 20px;
        }
        
        .invoice-header .badge {
            display: inline-block;
            background: white;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            border: 1.5px solid #d4af37;
            margin-top: 6px;
        }
        
        .invoice-body {
            padding: 20px;
        }
        
        .invoice-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        
        .invoice-row.total {
            font-size: 18px;
            font-weight: 900;
            color: #b8860b;
            border-top: 2px solid #d4af37;
            padding: 12px;
            margin-top: 10px;
            background: rgba(212,175,55,0.06);
            border-radius: 8px;
        }
        
        .invoice-actions {
            display: flex;
            gap: 6px;
            padding: 12px;
            background: #f5f1e8;
            border-top: 2px solid #d4af37;
            flex-wrap: wrap;
        }
        
        .invoice-actions button {
            flex: 1;
            padding: 8px;
            border: 1.5px solid #d4af37;
            border-radius: 8px;
            background: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            color: #b8860b;
            min-width: 60px;
        }
        
        .invoice-actions button:active {
            transform: scale(0.95);
        }
        
        /* تاریخچه */
        .history-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        .history-overlay.show {
            display: flex;
        }
        
        .history-box {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 20px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        
        .history-item {
            background: #f9f8f6;
            border: 1px solid #e8e4dc;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e2a;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        @media print {
            .app-card, .history-overlay, .toast, .invoice-actions {
                display: none !important;
            }
            .invoice-overlay {
                position: static !important;
                display: block !important;
                background: transparent !important;
            }
            #invoiceBox {
                border: 2px solid #000 !important;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- هدر -->
    <div class="header">
        <h1>🏆 طلا و سکه</h1>
        <div>
            <button onclick="openHistory()">📜 تاریخچه</button>
            <button onclick="exportCodes()" style="margin-right:5px;">📤</button>
        </div>
    </div>

    <!-- آپلود -->
    <div class="upload-box">
        <label for="fileInput">📂 وارد کردن از Excel</label>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleFile(event)" />
        <div class="info" id="fileInfo">فایل Excel خود را انتخاب کنید</div>
        <span class="link" onclick="downloadSample()">📥 دانلود نمونه فایل</span>
    </div>

    <!-- کد -->
    <div class="code-box">
        <input type="text" id="codeInput" placeholder="کد را وارد کنید..." />
        <button onclick="applyCode()">اعمال</button>
        <button class="btn-gray" onclick="openManage()">مدیریت</button>
    </div>

    <!-- قیمت‌ها -->
    <div class="form-group">
        <label>قیمت ۱۸ عیار (تومان)</label>
        <input type="text" id="goldPrice" placeholder="مثلاً ۴,۵۰۰,۰۰۰" onkeyup="formatNumber(this)" />
    </div>

    <div class="row">
        <div class="form-group">
            <label>نرخ دلار</label>
            <input type="text" id="usdRate" value="۶۰,۰۰۰" onkeyup="formatNumber(this)" />
        </div>
        <div class="form-group">
            <label>انس طلا</label>
            <input type="text" id="ouncePrice" value="۲,۴۰۰" onkeyup="formatNumber(this)" />
        </div>
    </div>

    <div class="form-group">
        <label>👤 نام خریدار</label>
        <input type="text" id="buyerName" placeholder="نام خریدار" />
    </div>

    <!-- تب‌ها -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gold')">💍 طلا</button>
        <button class="tab-btn" onclick="switchTab('coin')">🪙 سکه</button>
    </div>

    <!-- بخش طلا -->
    <div class="section active" id="goldSection">
        <div class="row">
            <div class="form-group">
                <label>عیار</label>
                <select id="caratSelect">
                    <option value="18">۱۸ عیار</option>
                    <option value="21">۲۱ عیار</option>
                    <option value="24">۲۴ عیار</option>
                </select>
            </div>
            <div class="form-group">
                <label>وزن (گرم)</label>
                <input type="number" id="weight" step="0.001" placeholder="وزن" />
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="isSecondHand" onchange="toggleSecondHand(this)" />
            <label>♻️ طلای دست دوم (بدون اجرت و مالیات)</label>
        </div>

        <div class="row">
            <div class="form-group">
                <label>نوع اجرت</label>
                <select id="wageType" onchange="toggleWageType()">
                    <option value="percent">درصدی</option>
                    <option value="toman">تومانی</option>
                </select>
            </div>
            <div class="form-group">
                <label id="wageLabel">اجرت (%)</label>
                <input type="number" id="wage" value="15" step="0.1" />
            </div>
        </div>

        <div class="row">
            <div class="form-group"><label>سود (%)</label><input type="number" id="profit" value="7" step="0.1" /></div>
            <div class="form-group"><label>مالیات (%)</label><input type="number" id="tax" value="9" step="0.1" /></div>
        </div>

        <button class="calc-btn" onclick="calcGold()">🧮 محاسبه</button>

        <div class="results" id="goldResult">
            <div class="result-item"><span>قیمت هر گرم</span><span id="rPrice">۰</span></div>
            <div class="result-item"><span>قیمت خام</span><span id="rRaw">۰</span></div>
            <div class="result-item"><span>اجرت</span><span id="rWage">۰</span></div>
            <div class="result-item"><span>سود</span><span id="rProfit">۰</span></div>
            <div class="result-item"><span>مالیات</span><span id="rTax">۰</span></div>
            <div class="result-item total"><span>💰 نهایی</span><span id="rTotal">۰</span></div>
            <div class="action-row">
                <button onclick="showGoldInvoice()">📄 فاکتور</button>
            </div>
        </div>
    </div>

    <!-- بخش سکه -->
    <div class="section" id="coinSection">
        <div class="form-group">
            <label>نوع سکه</label>
            <select id="coinType">
                <option value="emami" data-weight="8.133">سکه امامی</option>
                <option value="bahar" data-weight="8.133">بهار آزادی</option>
                <option value="nim" data-weight="4.066">نیم سکه</option>
                <option value="rob" data-weight="2.033">ربع سکه</option>
            </select>
        </div>
        <div class="row">
            <div class="form-group"><label>قیمت بازار</label><input type="text" id="coinPrice" placeholder="قیمت" onkeyup="formatNumber(this)" /></div>
            <div class="form-group"><label>تعداد</label><input type="number" id="coinCount" value="1" min="1" /></div>
        </div>
        <button class="calc-btn" onclick="calcCoin()">🧮 محاسبه</button>
        <div class="results" id="coinResult">
            <div class="result-item"><span>ارزش واقعی</span><span id="cReal">۰</span></div>
            <div class="result-item"><span>حباب هر عدد</span><span id="cBubble">۰</span></div>
            <div class="result-item total"><span>💰 نهایی</span><span id="cTotal">۰</span></div>
            <div class="action-row">
                <button onclick="showCoinInvoice()">📄 فاکتور</button>
            </div>
        </div>
    </div>
</div>

<!-- مودال مدیریت کدها -->
<div class="modal-overlay" id="manageModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>🔑 مدیریت کدها</h3>
            <button class="modal-close" onclick="closeManage()">&times;</button>
        </div>
        <div class="modal-list" id="codeList"></div>
        <div class="add-form">
            <div class="row">
                <input type="text" id="newCode" placeholder="کد" />
                <input type="number" id="newWeight" step="0.001" placeholder="وزن" />
            </div>
            <div class="row">
                <input type="number" id="newWage" step="0.1" placeholder="اجرت" />
                <input type="number" id="newProfit" step="0.1" placeholder="سود" />
                <input type="number" id="newTax" step="0.1" placeholder="مالیات" />
            </div>
            <button onclick="addCode()">➕ افزودن</button>
        </div>
    </div>
</div>

<!-- مودال فاکتور -->
<div class="invoice-overlay" id="invoiceModal">
    <div class="invoice-box" id="invoiceBox">
        <div class="invoice-header">
            <h3 id="invTitle">صورتحساب</h3>
            <div class="badge" id="invBuyer">خریدار: عمومی</div>
        </div>
        <div class="invoice-body" id="invContent"></div>
        <div class="invoice-actions">
            <button onclick="closeInvoice()">✖️ بستن</button>
            <button onclick="downloadPDF()">📥 PDF</button>
            <button onclick="downloadPNG()">🖼️ PNG</button>
            <button onclick="printInvoice()">🖨️ چاپ</button>
        </div>
    </div>
</div>

<!-- مودال تاریخچه -->
<div class="history-overlay" id="historyModal">
    <div class="history-box">
        <div class="modal-header">
            <h3>📜 تاریخچه</h3>
            <button class="modal-close" onclick="closeHistory()">&times;</button>
        </div>
        <div class="modal-list" id="historyList"></div>
        <button onclick="clearHistory()" style="padding:10px;background:#ff4d4d;color:white;border:none;border-radius:10px;cursor:pointer;">پاکسازی</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== داده‌ها =====
let lastGold = null;
let lastCoin = null;

// ===== ذخیره کدها =====
function getCodes() {
    try { return JSON.parse(localStorage.getItem('gold_codes') || '{}'); } 
    catch { return {}; }
}

function saveCodes(c) {
    localStorage.setItem('gold_codes', JSON.stringify(c));
}

// ===== اعمال کد =====
function applyCode() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code) return toast('کد را وارد کنید');
    
    const codes = getCodes();
    if (!codes[code]) return toast('❌ کد یافت نشد');
    
    const d = codes[code];
    if (d.weight !== undefined) document.getElementById('weight').value = d.weight;
    if (d.wage !== undefined) document.getElementById('wage').value = d.wage;
    if (d.profit !== undefined) document.getElementById('profit').value = d.profit;
    if (d.tax !== undefined) document.getElementById('tax').value = d.tax;
    
    toast('✅ کد ' + code + ' اعمال شد');
    document.getElementById('codeInput').value = '';
}

// ===== مدیریت کدها =====
function openManage() {
    renderCodes();
    document.getElementById('manageModal').classList.add('show');
}

function closeManage() {
    document.getElementById('manageModal').classList.remove('show');
}

function renderCodes() {
    const codes = getCodes();
    const container = document.getElementById('codeList');
    const keys = Object.keys(codes);
    
    if (keys.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">هیچ کدی ثبت نشده</div>';
        return;
    }
    
    container.innerHTML = keys.map(k => {
        const d = codes[k];
        return `
            <div class="code-item">
                <div>
                    <div class="name">🔑 ${k}</div>
                    <div class="details">وزن: ${d.weight || '---'} | اجرت: ${d.wage ?? '---'}% | سود: ${d.profit || '---'}% | مالیات: ${d.tax ?? '---'}%</div>
                </div>
                <button class="del" onclick="deleteCode('${k}')">✕</button>
            </div>
        `;
    }).join('');
}

function deleteCode(key) {
    if (!confirm('حذف شود؟')) return;
    const codes = getCodes();
    delete codes[key];
    saveCodes(codes);
    renderCodes();
    toast('کد ' + key + ' حذف شد');
}

function addCode() {
    const name = document.getElementById('newCode').value.trim().toUpperCase();
    const weight = parseFloat(document.getElementById('newWeight').value);
    const wage = parseFloat(document.getElementById('newWage').value);
    const profit = parseFloat(document.getElementById('newProfit').value);
    const tax = parseFloat(document.getElementById('newTax').value);
    
    if (!name) return toast('کد را وارد کنید');
    if (isNaN(weight) || weight <= 0) return toast('وزن معتبر وارد کنید');
    if (isNaN(wage)) return toast('اجرت معتبر وارد کنید');
    if (isNaN(profit)) return toast('سود معتبر وارد کنید');
    if (isNaN(tax)) return toast('مالیات معتبر وارد کنید');
    
    const codes = getCodes();
    if (codes[name]) return toast('❌ کد تکراری است');
    
    codes[name] = { weight, wage, profit, tax };
    saveCodes(codes);
    
    document.getElementById('newCode').value = '';
    document.getElementById('newWeight').value = '';
    document.getElementById('newWage').value = '';
    document.getElementById('newProfit').value = '';
    document.getElementById('newTax').value = '';
    
    renderCodes();
    toast('✅ کد ' + name + ' ثبت شد');
}

// ===== آپلود فایل =====
function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const data = new Uint8Array(ev.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(ws);
            
            if (json.length === 0) return toast('فایل خالی است');
            
            const cols = Object.keys(json[0]);
            if (!cols.includes('کد') || !cols.includes('وزن')) {
                return toast('ستون‌های کد و وزن الزامی است');
            }
            
            let codes = getCodes();
            let added = 0;
            
            json.forEach(row => {
                const code = String(row['کد'] || '').trim().toUpperCase();
                const weight = parseFloat(row['وزن']);
                const wage = parseFloat(row['اجرت'] || 0);
                const profit = parseFloat(row['سود'] || 0);
                const tax = parseFloat(row['مالیات'] || 0);
                
                if (!code || isNaN(weight)) return;
                if (codes[code]) return;
                
                codes[code] = { weight, wage, profit, tax };
                added++;
            });
            
            saveCodes(codes);
            document.getElementById('fileInfo').innerHTML = '✅ ' + added + ' کد جدید اضافه شد';
            toast('✅ ' + added + ' کد وارد شد');
            renderCodes();
        } catch(err) {
            toast('❌ خطا در خواندن فایل');
        }
    };
    reader.readAsArrayBuffer(file);
}

// ===== ابزارها =====
function formatNumber(el) {
    let v = el.value.replace(/,/g, '');
    if (!isNaN(v) && v !== '') el.value = Number(v).toLocaleString();
}

function getNum(el) {
    return parseFloat(el.value.replace(/,/g, '')) || 0;
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function switchTab(tab) {
    document.getElementById('goldSection').classList.toggle('active', tab === 'gold');
    document.getElementById('coinSection').classList.toggle('active', tab === 'coin');
    document.querySelectorAll('.tab-btn').forEach((b,i) => {
        b.classList.toggle('active', (i===0 && tab==='gold') || (i===1 && tab==='coin'));
    });
}

function toggleSecondHand(cb) {
    const w = document.getElementById('wage');
    const t = document.getElementById('tax');
    if (cb.checked) {
        w.value = 0; w.disabled = true;
        t.value = 0; t.disabled = true;
    } else {
        w.disabled = false; t.disabled = false;
    }
}

function toggleWageType() {
    const type = document.getElementById('wageType').value;
    document.getElementById('wageLabel').textContent = type === 'percent' ? 'اجرت (%)' : 'اجرت (تومان)';
}

function getBuyer() {
    return document.getElementById('buyerName').value.trim() || 'مشتری محترم';
}

function persianDate() {
    return new Date().toLocaleDateString('fa-IR', { 
        year: 'numeric', month: 'long', day: 'numeric', 
        hour: '2-digit', minute: '2-digit' 
    });
}

function saveHistory(item) {
    let h = JSON.parse(localStorage.getItem('gold_history') || '[]');
    h.unshift(item);
    if (h.length > 30) h.pop();
    localStorage.setItem('gold_history', JSON.stringify(h));
}

// ===== محاسبه طلا =====
function calcGold() {
    const gold18 = getNum(document.getElementById('goldPrice'));
    if (!gold18) return toast('قیمت ۱۸ عیار را وارد کنید');
    
    const carat = parseFloat(document.getElementById('caratSelect').value);
    const weight = parseFloat(document.getElementById('weight').value) || 0;
    if (!weight) return toast('وزن را وارد کنید');
    
    const wageVal = parseFloat(document.getElementById('wage').value) || 0;
    const wageType = document.getElementById('wageType').value;
    const profitP = parseFloat(document.getElementById('profit').value) || 0;
    const taxP = parseFloat(document.getElementById('tax').value) || 0;
    
    let perGram = gold18;
    if (carat === 21) perGram = (gold18 / 750) * 875;
    else if (carat === 24) perGram = (gold18 / 750) * 995;
    
    const raw = perGram * weight;
    let wage = wageType === 'percent' ? raw * (wageVal / 100) : wageVal * weight;
    const profit = (raw + wage) * (profitP / 100);
    const tax = (wage + profit) * (taxP / 100);
    const total = raw + wage + profit + tax;
    
    lastGold = { carat, weight, raw, wage, profit, tax, total };
    
    document.getElementById('rPrice').textContent = Math.round(perGram).toLocaleString() + ' تومان';
    document.getElementById('rRaw').textContent = Math.round(raw).toLocaleString() + ' تومان';
    document.getElementById('rWage').textContent = Math.round(wage).toLocaleString() + ' تومان';
    document.getElementById('rProfit').textContent = Math.round(profit).toLocaleString() + ' تومان';
    document.getElementById('rTax').textContent = Math.round(tax).toLocaleString() + ' تومان';
    document.getElementById('rTotal').textContent = Math.round(total).toLocaleString() + ' تومان';
    document.getElementById('goldResult').style.display = 'block';
    
    saveHistory({ title: `طلا ${carat} عیار (${weight} گرم)`, buyer: getBuyer(), total, date: persianDate() });
}

// ===== محاسبه سکه =====
function calcCoin() {
    const gold18 = getNum(document.getElementById('goldPrice'));
    if (!gold18) return toast('قیمت ۱۸ عیار را وارد کنید');
    
    const sel = document.getElementById('coinType');
    const opt = sel.options[sel.selectedIndex];
    const coinW = parseFloat(opt.getAttribute('data-weight'));
    const price = getNum(document.getElementById('coinPrice'));
    if (!price) return toast('قیمت سکه را وارد کنید');
    const count = parseInt(document.getElementById('coinCount').value) || 1;
    
    const real = ((gold18 / 750) * 900) * coinW;
    const bubble = price - real;
    const total = price * count;
    
    lastCoin = { name: opt.text, count, real, bubble, total };
    
    document.getElementById('cReal').textContent = Math.round(real * count).toLocaleString() + ' تومان';
    document.getElementById('cBubble').textContent = Math.round(bubble).toLocaleString() + ' تومان';
    document.getElementById('cTotal').textContent = Math.round(total).toLocaleString() + ' تومان';
    document.getElementById('coinResult').style.display = 'block';
    
    saveHistory({ title: `${opt.text} (${count} عدد)`, buyer: getBuyer(), total, date: persianDate() });
}

async function downloadPDF() {
    try {
        toast('⏳ ساخت PDF...');
        const el = document.getElementById('invoiceBox');
        const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#fff' });
        const img = canvas.toDataURL('image/jpeg', 0.95);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const w = 140, h = (canvas.height * w) / canvas.width;
        pdf.addImage(img, 'JPEG', (210-w)/2, (297-h)/2, w, h);
        pdf.save('factor.pdf');
        toast('✅ PDF دانلود شد');
    } catch(e) {
        toast('❌ خطا');
    }
}
